<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tabadol : échangez les livres que vous avez lus contre ceux que vous voulez. Échange de livres gratuit entre lecteurs au Maroc.">
<title>تبادل Tabadol – échangez des livres au Maroc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e3;--ink:#1f2a24;--muted:#5b6556;--card:#fffdf6;--line:#ddd3b8;--accent:#0f5c4d;--on-accent:#fff;--good:#0f5c4d;--bad:#9c2b2b;--gold:#c8962e;--gold-d:#8a6414;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400}
button,select,input,textarea{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:26px 16px 56px}
header{border-bottom:1px solid var(--gold);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:56px;height:56px;flex:none}
header h1{margin:0;display:flex;align-items:baseline;gap:10px;line-height:1.1}
.nm-ar{font:700 3rem/1 Amiri,"Noto Naskh Arabic",serif;color:var(--accent)}
.nm-la{font:400 1.7rem/1 "Young Serif",Georgia,serif;color:var(--ink)}
header p.ar{font:700 1.4rem/1.5 Amiri,"Noto Naskh Arabic",serif;color:var(--gold-d);margin:6px 0 0;max-width:none;text-align:left}
header p{margin:8px 0 22px;color:var(--muted);max-width:34ch}
nav,.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:8px;margin-bottom:22px;overflow-x:auto}
.tab{flex:1;background:none;border:0;border-radius:5px;padding:9px 10px;font-size:.95rem;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.badge{background:var(--gold);color:#14161f;border-radius:99px;padding:0 7px;font-size:.78rem;margin-left:6px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 16px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.book{display:flex;flex-direction:column}
.cover{aspect-ratio:3/4;display:grid;grid-template-rows:1fr 2.2fr 1fr;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:inset 7px 0 0 rgba(0,0,0,.2),0 6px 14px -8px rgba(0,0,0,.45)}
.cover i{background:var(--b);color:var(--t);font:600 .72rem/1.2 "DM Sans",system-ui,sans-serif;font-style:normal;padding:7px 10px 7px 16px;display:flex;align-items:flex-end}
.cover .mid{background:#fbf6e6;color:#14161f;display:grid;place-items:center;text-align:center;padding:8px 10px 8px 16px}
.cover b{font:400 1.08rem/1.15 "Young Serif",Georgia,serif}
.info{padding:10px 2px 0;font-size:.9rem;display:flex;flex-direction:column;gap:2px;flex:1}
.info>span:first-child{font-weight:700}
.info small{color:var(--muted);font-size:.85rem}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:10px 12px;font-weight:700;font-size:.92rem;cursor:pointer;margin-top:auto}
.info .btn{margin-top:8px}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.row{background:var(--card);border-left:4px solid var(--line);border-radius:4px 8px 8px 4px;padding:14px 16px;margin-bottom:10px}
.row.match{border-left-color:var(--gold)}
.row p{margin:0 0 10px}
.acts{display:flex;gap:8px}
.status{font-weight:700;font-size:.88rem}
.ok{color:var(--good)}.no{color:var(--bad)}.wait{color:var(--muted)}
h2{font-size:1.25rem;margin:26px 0 10px}
form.add{display:grid;gap:12px;grid-template-columns:1fr 1fr;background:var(--card);border-radius:8px;padding:16px;margin-bottom:20px}
form.add .full{grid-column:1/-1}
label{font-size:.88rem;font-weight:700;display:grid;gap:4px}
input,select,textarea{font-size:1rem;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.empty{color:var(--muted);padding:16px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:4px 6px 4px 14px;margin:0 6px 6px 0;font-size:.95rem}
.chip button{border:0;background:var(--bg);color:var(--ink);border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:1rem;line-height:1}
.flag{background:var(--gold);color:#14161f;border-radius:4px;padding:2px 8px;font-weight:700;font-size:.78rem;align-self:flex-start;margin-top:4px}
dialog{border:0;border-radius:10px;background:var(--card);color:var(--ink);width:min(92vw,440px);padding:20px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(24,30,24,.55)}
.pick{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:6px;font-weight:400;cursor:pointer}
.pick input{width:auto}
.hint{background:var(--bg);border-left:3px solid var(--gold);border-radius:4px;padding:10px 12px;font-size:.92rem;margin:12px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
#q{grid-column:1/-1}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 18px}
.cityl{display:flex;align-items:center;gap:8px;margin:0 0 20px;font-weight:700}
.cityl select{width:auto}
.cover.ph{display:block}
.cover.ph img{width:100%;height:100%;object-fit:cover;display:block}
.flag.alt{background:var(--line);color:var(--ink)}
.about{background:var(--card);border-radius:8px;padding:20px}
.about p{margin:0 0 12px}
.about ol,.about ul{padding-left:22px;margin:0 0 12px}
.about li{margin-bottom:8px}
.about .ar2{font:700 1.4rem/1.5 Amiri,"Noto Naskh Arabic",serif;color:var(--gold-d);margin:16px 0}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.userbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.userbar .cityl{margin:0}
#who{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:700}
#who button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;padding:4px}
.anon nav,.anon .userbar{display:none}
.authbox{margin-bottom:18px}
.authbox .seg{margin-bottom:16px}
.err{color:var(--bad);font-weight:700;margin:0;min-height:1.2em}
.owner{display:flex;align-items:center;gap:8px;font-weight:700}
.row.ok{border-left-color:var(--good)}
.btn.bad{background:var(--bad);color:#fff}
#cmsgs{height:240px;overflow:auto;background:var(--bg);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.msg{max-width:82%;padding:7px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-color:transparent}
.msg.meet{border:2px solid var(--gold)}
.cform{display:flex;gap:8px}.cform .btn{margin-top:0}
#stars button{background:none;border:0;font-size:2.4rem;line-height:1;cursor:pointer;color:var(--line);padding:0 3px}
#stars button.on{color:var(--gold)}
.rtag{display:inline-flex;gap:6px;align-items:center;margin-right:12px;font-weight:400}.rtag input{width:auto}
.cl{display:block;color:inherit;text-decoration:none}
.bigph{width:100%;max-height:440px;object-fit:contain;background:var(--line);border-radius:6px;display:block}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs button{padding:0;border:2px solid var(--line);border-radius:6px;background:none;cursor:pointer;width:64px;height:64px;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.bookpage{display:grid;gap:18px}
@media(min-width:620px){.bookpage{grid-template-columns:280px 1fr}}
.bp-desc{white-space:pre-wrap;background:var(--card);border-radius:6px;padding:10px 12px;margin:0 0 12px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer;padding:0;font-size:inherit}
.guestbar{background:var(--card);border-left:4px solid var(--gold);border-radius:4px;padding:10px 12px;margin:0 0 14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <svg class="mark" viewBox="0 0 48 48" role="img" aria-label="Logo Tabadol"><rect width="48" height="48" rx="11" fill="#0f5c4d"/><rect x="11" y="17" width="9" height="14" rx="1.5" fill="#fbf6e6"/><rect x="28" y="17" width="9" height="14" rx="1.5" fill="#c8962e"/><g fill="none" stroke="#fbf6e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 10.5h22M31 7l4 3.5-4 3.5"/><path d="M35 37.5H13M17 34l-4 3.5 4 3.5"/></g></svg>
    <div>
      <h1><span class="nm-ar" lang="ar" dir="rtl">تبادل</span><span class="nm-la">Tabadol</span></h1>
      <p class="ar" lang="ar" dir="rtl">تبادل الكتب، تبادل المعرفة والعلم</p>
    </div>
  </div>
  <p>Échangez les livres que vous avez finis contre ceux que vous voulez lire ensuite, partout au Maroc.</p>
  <div class="userbar"><label class="cityl">Ma ville <select id="mycity"></select></label><span id="who"></span></div>
</header>
<nav role="tablist" id="tabs">
  <button class="tab" role="tab" data-v="browse" aria-selected="true">Parcourir</button>
  <button class="tab" role="tab" data-v="matches" aria-selected="false">Correspondances<span class="badge" id="mbadge" hidden></span></button>
  <button class="tab" role="tab" data-v="shelf" aria-selected="false">Mon étagère</button>
  <button class="tab" role="tab" data-v="reqs" aria-selected="false">Demandes<span class="badge" id="badge" hidden></span></button>
  <button class="tab" role="tab" data-v="about" aria-selected="false">À propos</button>
</nav>
<main id="view"></main>
</div>

<dialog id="dlg">
  <h3 id="dtitle" style="margin:0 0 10px"></h3>
  <p style="margin:0 0 8px">Choisissez un de vos livres à proposer :</p>
  <div id="picks"></div>
  <label>Ajouter de l'argent (facultatif)
    <input type="number" id="money" min="0" step="5" value="0">
  </label>
  <div class="hint" id="hint"></div>
  <div class="acts">
    <button class="btn" id="send">Envoyer la demande d'échange</button>
    <button class="btn alt" id="cancel" style="margin-top:auto">Annuler</button>
  </div>
</dialog>
<dialog id="cdlg">
  <h3 id="ctitle" style="margin:0 0 6px"></h3>
  <p class="sub" style="margin:0 0 10px">Retrouvez-vous dans un lieu public, de jour. Ne partagez pas votre adresse.</p>
  <div id="cmsgs" aria-live="polite"></div>
  <form id="cf" class="cform"><input id="cin" maxlength="500" placeholder="Votre message" autocomplete="off" required><button class="btn" type="submit">Envoyer</button></form>
  <div class="acts" style="margin-top:10px;flex-wrap:wrap"><button class="btn alt" id="cmeet" type="button">Proposer un rendez-vous</button><button class="btn alt" id="crep" type="button">Signaler</button><button class="btn alt" id="cclose" type="button">Fermer</button></div>
  <div id="cextra"></div>
</dialog>
<dialog id="rdlg">
  <h3 id="rtitle" style="margin:0 0 10px"></h3>
  <div id="stars" role="radiogroup" aria-label="Note"></div>
  <div id="rtags" style="margin:10px 0"></div>
  <label>Commentaire (facultatif)<input id="rcm" maxlength="300"></label>
  <p class="sub" id="rhint" style="margin:10px 0"></p>
  <div class="acts"><button class="btn" id="rsend" type="button">Envoyer la note</button><button class="btn alt" id="rcancel" type="button" style="margin-top:auto">Plus tard</button></div>
</dialog>
<div id="toast" role="status"></div>

<script>
// PREVIEW ONLY: an in-memory fake server so sign-up, chat, meeting confirmation and ratings can be tried without Cloudflare.
(()=>{
const U=[{name:"Demo",email:"demo@tabadol.ma",pw:"demo1234",city:"Casablanca"},{name:"Rafael",city:"Fès"},{name:"Sam",city:"Casablanca"},{name:"Lena",city:"Marrakech"},{name:"Omar",city:"Tanger"}];
const bk=(id,o,title,author,cat,cond,value)=>({id,o,title,author,cat,cond,value});
let B=[bk(1,"Demo","Sapiens","Yuval Noah Harari","Histoire","Bon état",90),bk(2,"Demo","Atomic Habits","James Clear","Développement personnel","Comme neuf",80),bk(3,"Rafael","Dune","Frank Herbert","Science-fiction","Bon état",100),bk(4,"Sam","Project Hail Mary","Andy Weir","Science-fiction","Comme neuf",120),bk(5,"Sam","Norwegian Wood","Haruki Murakami","Roman","Usé",60),bk(6,"Omar","The Hobbit","J.R.R. Tolkien","Fantasy","Bon état",70),bk(7,"Demo","Educated","Tara Westover","Biographie","Bon état",90),bk(8,"Lena","The Alchemist","Paulo Coelho","Roman","Bon état",70)];
let W=[["Demo","Dune"],["Demo","Project Hail Mary"],["Rafael","Atomic Habits"],["Sam","Sapiens"],["Lena","Atomic Habits"],["Omar","Dune"]].map(([u,title],i)=>({id:i+1,u,title}));
const rq=(id,from,to,want,offer,money,status,x)=>({id,from,to,want,offer,money,status,fromOk:0,toOk:0,doneAt:null,...x});
let R=[rq(1,"Sam","Demo",1,5,30,"pending"),rq(2,"Demo","Rafael",3,2,0,"accepted"),rq(3,"Demo","Lena",7,8,0,"done",{fromOk:1,toOk:1,doneAt:Date.now()-864e5})];
let MS=[{id:1,req:2,from:"Rafael",body:"Bonjour ! On se retrouve samedi pour l'échange ?",kind:"text"}],RD={},RT=[];
let STAT={Rafael:{avg:4.8,n:5},Sam:{avg:4.5,n:2},Lena:{avg:5,n:3}},n=100,cur=null;
const nz=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\b(the|a|an|le|la)\b/g," ").replace(/\s+/g," ").trim();
const hit=(t,b)=>{const w=nz(t),f=nz(b.title);return w.length>2&&(f.includes(w)||w.includes(f)||nz(b.author).includes(w))};
const mm=()=>{const out=[];[...new Set(B.map(b=>b.o))].filter(u=>u!==cur).forEach(u=>B.filter(b=>b.o===u&&W.some(w=>w.u===cur&&hit(w.title,b))).forEach(t=>B.filter(b=>b.o===cur&&W.some(w=>w.u===u&&hit(w.title,b))).forEach(m2=>out.push({user:u,theirs:t.id,mine:m2.id}))));return out};
const DESC={3:"Édition de poche, quelques pages jaunies. Parfait pour une première lecture.",4:"Comme neuf, lu une seule fois. Couverture rigide.",5:"Un peu usé mais complet. Couverture pliée.",6:"Belle édition illustrée, très bien conservée.",8:"Édition de poche, lisible et propre."};
const real=window.fetch,J=x=>new Response(JSON.stringify(x),{headers:{"content-type":"application/json"}}),X=e=>J({error:e});
window.fetch=async(url,o={})=>{
 if(!String(url).startsWith("/api/"))return real(url,o);
 const L=new URL(url,"https://x"),[,,a,b,c]=L.pathname.split("/"),m=o.method||"GET",d=o.body?JSON.parse(o.body):{},me=U.find(u=>u.name===cur);
 if(a==="signup"){if(U.some(u=>u.name.toLowerCase()===String(d.name).toLowerCase()||u.email===d.email))return X("Ce nom d'utilisateur ou cet e-mail est déjà utilisé.");if(String(d.password).length<8)return X("Mot de passe : 8 caractères minimum.");U.push({name:d.name.trim(),email:d.email,pw:d.password,city:d.city,avatar:d.avatar||""});cur=d.name.trim();return J({ok:true})}
 if(a==="login"){const u=U.find(u=>u.email===d.email&&u.pw===d.password);if(!u)return X("E-mail ou mot de passe incorrect.");cur=u.name;return J({ok:true})}
 if(a==="logout"){cur=null;return J({ok:true})}
 if(a==="public")return J({books:B.map(b=>({id:b.id,title:b.title,author:b.author,cat:b.cat,cond:b.cond,value:b.value,description:b.description||DESC[b.id]||"",hasImg:b.img?1:0,extra:(b.imgs||[]).length,city:U.find(u=>u.name===b.o).city}))});
 if(!me)return a==="state"?J({me:null}):X("Connectez-vous d'abord.");
 const unread=r=>MS.filter(x=>x.req===r.id&&x.from!==cur&&x.id>(RD[r.id+":"+cur]||0)).length,mine=R.filter(r=>r.from===cur||r.to===cur);
 if(a==="state")return J({me:{name:me.name,city:me.city},users:U.map(u=>({name:u.name,city:u.city,av:u.avatar?1:0})),books:B.map(b=>({id:b.id,title:b.title,author:b.author,cat:b.cat,cond:b.cond,value:b.value,hasImg:b.img?1:0,description:b.description||DESC[b.id]||"",extra:(b.imgs||[]).length,owner:b.o})),wishes:W.filter(w=>w.u===cur).map(w=>({id:w.id,title:w.title})),matches:mm(),requests:mine.map(r=>({id:r.id,fromName:r.from,toName:r.to,want:r.want,offer:r.offer,money:r.money,status:r.status,fromOk:r.fromOk,toOk:r.toOk,doneAt:r.doneAt,unread:unread(r),iRated:RT.some(x=>x.req===r.id&&x.by===cur)})),ratings:Object.entries(STAT).map(([name,v])=>({name,avg:v.avg,n:v.n})),swaps:[]});
 if(a==="unread")return J({pending:R.filter(r=>r.to===cur&&r.status==="pending").length,unread:mine.reduce((s,r)=>s+unread(r),0)});
 if(a==="me")me.city=d.city;
 if(a==="report")return J({ok:true});
 if(a==="books"&&m==="DELETE"){const id=+b,bk2=B.find(x=>x.id===id);if(!bk2||bk2.o!==cur)return X("Livre introuvable.");if(R.some(r=>r.status==="accepted"&&(r.want===id||r.offer===id)))return X("Ce livre est réservé par un échange en cours.");B=B.filter(x=>x.id!==id);R=R.filter(r=>!(r.status==="pending"&&(r.want===id||r.offer===id)));return J({ok:true})}
 if(a==="books"&&m==="POST")B.unshift({id:++n,o:cur,title:d.title,author:d.author,cat:d.cat,cond:d.cond,value:d.value,img:d.img,description:d.description,imgs:d.imgs||[]});
 if(a==="wishes"&&m==="POST")W.push({id:++n,u:cur,title:d.title});
 if(a==="wishes"&&m==="DELETE")W=W.filter(w=>w.id!==+b);
 if(a==="requests"&&!b)R.unshift(rq(++n,cur,B.find(x=>x.id===+d.want).o,+d.want,+d.offer,d.money||0,"pending"));
 if(a==="requests"&&b&&c==="messages"){const r=R.find(x=>x.id===+b);if(!r)return X("Discussion introuvable.");
  if(m==="POST"){MS.push({id:++n,req:r.id,from:cur,body:d.body,kind:d.kind||"text"});return J({ok:true})}
  const after=+L.searchParams.get("after")||0,rows=MS.filter(x=>x.req===r.id&&x.id>after);
  if(rows.length)RD[r.id+":"+cur]=rows[rows.length-1].id;
  return J({open:r.status==="accepted"||r.status==="done",messages:rows.map(x=>({id:x.id,mine:x.from===cur,body:x.body,kind:x.kind,at:0}))})}
 if(a==="requests"&&b&&c==="rate"){const r=R.find(x=>x.id===+b),o2=r.from===cur?r.to:r.from,s=STAT[o2]||{avg:0,n:0};RT.push({req:r.id,by:cur});STAT[o2]={n:s.n+1,avg:Math.round((s.avg*s.n+d.stars)/(s.n+1)*10)/10};return J({ok:true})}
 if(a==="requests"&&b){const r=R.find(x=>x.id===+b);if(!r)return X("Demande introuvable.");
  if(c==="decline")r.status="declined";

   if(r.fromOk&&r.toOk){B.find(x=>x.id===r.want).o=r.from;B.find(x=>x.id===r.offer).o=r.to;r.status="done";r.doneAt=Date.now();return J({ok:true,done:true})}}}
 return J({ok:true})};
window.PV={photo:(id,n)=>{const b=B.find(x=>x.id===id);return n?(b?.imgs||[])[n-1]||"":b?.img||""},avatar:nm=>U.find(u=>u.name===nm)?.avatar||""};

 document.querySelectorAll("#stars button").forEach(x=>{x.classList.toggle("on",+x.dataset.s<=rateStars);x.setAttribute("aria-checked",+x.dataset.s===rateStars)})};
$("#rcancel").onclick=()=>$("#rdlg").close();
$("#rsend").onclick=async()=>{if(!rateStars){toast("Choisissez une note");return}
 const tags=[...document.querySelectorAll("#rtags input:checked")].map(x=>x.value);
 const r=await api(`/api/requests/${rateId}/rate`,"POST",{stars:rateStars,tags,comment:$("#rcm").value});
 $("#rdlg").close();toast(r.error||"Merci pour votre note");await boot()};
async function api(path,method="GET",body){
 try{const r=await fetch(path,{method,headers:{"content-type":"application/json","x-requested-with":"tabadol"},body:body?JSON.stringify(body):undefined});return await r.json()}
 catch(e){return{error:"Connexion impossible. Réessayez."}}}
async function boot(){
 const r=await api("/api/state");
 if(r.error||!r.me){me=null;const g=await api("/api/public");books=(g.books||[]).map(b=>({...b,hasImg:!!b.hasImg,c:b.id%6,owner:"",gcity:b.city}));reqs=[];render();return}
 me=r.me.name;gAuth=false;
 books=r.books.map(b=>({...b,hasImg:!!b.hasImg,c:b.id%6}));
 reqs=r.requests.filter(x=>books.some(b=>b.id===x.want)&&books.some(b=>b.id===x.offer)).map(x=>({id:x.id,from:x.fromName,to:x.toName,want:x.want,offer:x.offer,money:x.money,status:x.status,fromOk:x.fromOk,toOk:x.toOk,doneAt:x.doneAt,unread:x.unread||0,iRated:!!x.iRated}));
 wish={};city={};avatars={};myWishes=[];rat={};swp={};(r.ratings||[]).forEach(x=>rat[x.name]=x);(r.swaps||[]).forEach(x=>swp[x.name]=x.n);unreadTotal=reqs.reduce((a,x)=>a+(x.unread||0),0);
 r.users.forEach(u=>{city[u.name]=u.city;avatars[u.name]=!!u.av});
 srvMatches=r.matches||[];
 r.wishes.forEach(w=>{(wish[me]=wish[me]||[]).push(w.title);myWishes.push(w)});
 render()}
async function act(id,what,msg){const r=await api(`/api/requests/${id}/${what}`,"POST");toast(r.error||(r.done?"Échange terminé ! Vous pouvez noter l'autre membre.":msg));await boot()}
function renderAuth(mode){
 authMode=mode||authMode;const su=authMode==="signup";
 $("#view").innerHTML=`<div class="about authbox"><p style="margin:0 0 12px"><button class="btn alt" type="button" data-gv="browse" style="margin:0">← Voir les livres</button></p><div class="seg"><button class="tab" data-am="login" aria-selected="${!su}">Connexion</button><button class="tab" data-am="signup" aria-selected="${su}">Inscription</button></div>
 <form id="af" class="add" style="grid-template-columns:1fr">
 ${su?`<label>Nom d'utilisateur<input name="name" required minlength="2" maxlength="30" autocomplete="username"></label>`:""}
 <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
 <label>Mot de passe${su?" (8 caractères minimum)":""}<input name="password" type="password" required minlength="8" autocomplete="${su?"new-password":"current-password"}"></label>
 ${su?`<label>Ville<select name="city">${CITY_NAMES.map(c=>`<option>${c}</option>`).join("")}</select></label>
 <label>Téléphone (facultatif)<input name="phone" type="tel" autocomplete="tel"></label>
 <label>Photo de profil ou logo (facultatif)<input name="avatar" type="file" accept="image/*"></label>`:""}
 <p class="sub" style="margin:0">Aperçu : compte de démonstration <strong>demo@tabadol.ma</strong> / <strong>demo1234</strong>, ou créez le vôtre. Dans « Demandes », essayez le chat, « Échange effectué » et « Noter ». Les données sont fictives et disparaissent au rechargement.</p><p class="err" id="aerr" role="alert"></p>
 <button class="btn" type="submit">${su?"Créer mon compte":"Se connecter"}</button></form></div>`+ABOUT.replace(/<button[\s\S]*?<\/button>/,"");
 $("#af").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),body=Object.fromEntries([...f].filter(([k])=>k!=="avatar"));
  const go=async avatar=>{const r=await api(su?"/api/signup":"/api/login","POST",{...body,avatar});if(r.error){$("#aerr").textContent=r.error;return}await boot()};
  const file=f.get("avatar");file&&file.size?shrink(file,go,200):go("")};
 showPublic()}
function render(){
 document.body.classList.toggle("anon",!me);
 if(!me){guestRender();return}
 routeHash();
 $("#mycity").value=city[me];
 $("#who").innerHTML=`${avatars[me]?`<img class="av" src="${PV.avatar(me)}" alt="">`:""}<span>${esc(me)}</span><button data-out>Se déconnecter</button>`;
 document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===(view==="book"?prevView:view)));
 const inc=reqs.filter(r=>r.to===me&&r.status==="pending").length+unreadTotal;
 $("#badge").hidden=!inc;$("#badge").textContent=inc;
 const v=$("#view"),M=matches();
 $("#mbadge").hidden=!M.length;$("#mbadge").textContent=M.length;
 M.forEach(x=>{const k=x.theirs.id+"-"+x.my.id;if(!seen.has(k)){seen.add(k);if(ready)setTimeout(()=>toast(`Nouvelle correspondance avec ${x.u} !`),50)}});
 ready=true;
 if(view==="browse"){
  v.innerHTML=`<div class="filters"><input type="search" id="q" placeholder="Rechercher un titre ou un auteur" aria-label="Rechercher un livre"><select id="fc" aria-label="Catégorie"><option value="">Toutes les catégories</option>${CATS.map(c=>`<option>${c}</option>`).join("")}</select><select id="fs" aria-label="État du livre (occasion)"><option value="">Tous les états</option>${CONDS.map(c=>`<option>${c}</option>`).join("")}</select></div><p class="sub">Les livres que vous cherchez, dont le propriétaire veut un des vôtres, dans votre ville ou à proximité, apparaissent en premier.</p><div id="res"></div>`;
  $("#q").value=F.q;$("#fc").value=F.cat;$("#fs").value=F.cond;
  $("#q").oninput=e=>{F.q=e.target.value;drawRes()};$("#fc").onchange=e=>{F.cat=e.target.value;drawRes()};$("#fs").onchange=e=>{F.cond=e.target.value;drawRes()};
  drawRes();
 }else if(view==="matches"){
  v.innerHTML=`<p style="margin-top:0">Tabadol compare toutes les étagères et listes d'envies. Une correspondance apparaît quand vous possédez un livre que quelqu'un veut et que cette personne possède un livre que vous voulez.</p>`+
  (M.length?M.map(x=>{const s=pend(x);return `<div class="row match"><p><strong>Correspondance avec ${esc(x.u)}</strong> <small>(${esc(city[x.u])}, ${distLbl(x.u)})</small><br>Vous donnez « ${esc(x.my.title)} » (${x.my.value} DH) et recevez « ${esc(x.theirs.title)} » (${x.theirs.value} DH).</p>${s?`<span class="status wait">${s}</span>`:`<button class="btn" data-prop="${x.theirs.id}-${x.my.id}">Proposer cet échange</button>`}</div>`}).join(""):`<p class="empty">Aucune correspondance pour l'instant. Ajoutez des livres souhaités à votre liste d'envies dans Mon étagère.</p>`);
 }else if(view==="book"){
  v.innerHTML=bookPage(bookId);
 }else if(view==="about"){
  v.innerHTML=ABOUT;
 }else if(view==="shelf"){
  v.innerHTML=`<form class="add" id="addf"><label class="full">Titre<input name="t" required></label>
  <label>Auteur<input name="a" required></label>
  <label>Valeur estimée (DH)<input name="v" type="number" min="5" step="5" value="80" required></label>
  <label>État<select name="c"><option>Comme neuf</option><option selected>Bon état</option><option>Usé</option></select></label>
  <label>Catégorie<select name="k">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label><label class="full">Description (facultatif)<textarea name="d" maxlength="500" rows="3" placeholder="État, édition, pages jaunies…"></textarea></label><label class="full">Photos (jusqu'à 3)<input name="p" type="file" accept="image/*" multiple></label><button class="btn full" type="submit">Ajouter à mon étagère</button></form>
  ${mine().length?`<div class="grid">${mine().map(b=>card(b,delBtn(b))).join("")}</div>`:`<p class="empty">Votre étagère est vide. Ajoutez un livre ci-dessus pour commencer à échanger.</p>`}
  <h2>Ma liste d'envies</h2>
  <p class="sub">Votre liste est privée : personne ne la voit. Tabadol l'utilise seulement pour trouver des correspondances.</p>
  <form class="add" id="wf" style="grid-template-columns:1fr auto"><label>Livre que vous voulez<input name="w" required></label><button class="btn" type="submit" style="align-self:end;margin-top:0">Ajouter</button></form>
  <div>${wishHtml()}</div>`;
  $("#wf").onsubmit=async e=>{e.preventDefault();const t=new FormData(e.target).get("w").trim();
   if(t&&!myWishes.some(x=>norm(x.title)===norm(t))){const r=await api("/api/wishes","POST",{title:t});if(r.error)toast(r.error);await boot()}};
  $("#addf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),files=f.getAll("p").filter(x=>x&&x.size).slice(0,3);
   const imgs=await Promise.all(files.map(x=>new Promise(ok=>shrink(x,ok))));
   const r=await api("/api/books","POST",{title:f.get("t"),author:f.get("a"),cond:f.get("c"),cat:f.get("k"),value:+f.get("v"),description:f.get("d"),img:imgs[0]||"",imgs:imgs.slice(1).filter(Boolean)});
   if(r.error){toast(r.error);return}toast("Livre ajouté");await boot()};
 }else{
  const line=r=>{const w=get(r.want),o=get(r.offer);
   const m=r.money?` + ${r.money} DH`:"";
   return `<strong>${r.from===me?"Vous proposez":esc(r.from)+" propose"}</strong> « ${esc(o.title)} »${m} contre « ${esc(w.title)} »`};
  const inc=reqs.filter(r=>r.to===me&&r.status==="pending");
  const going=reqs.filter(r=>r.status==="accepted");
  const sent=reqs.filter(r=>r.from===me&&r.status==="pending");
  const fin=reqs.filter(r=>["done","declined","cancelled"].includes(r.status));
  const other=r=>r.from===me?r.to:r.from;
  const goingRow=r=>{const mineOk=r.from===me?r.fromOk:r.toOk;
   return `<div class="row ok"><p>${line(r)}<br><small>Avec ${esc(other(r))} (${esc(city[other(r)]||"")})</small></p>
   <div class="acts" style="flex-wrap:wrap"><button class="btn" data-chat="${r.id}">Ouvrir le chat${r.unread?` <span class="badge">${r.unread}</span>`:""}</button>
   ${mineOk?`<span class="status wait">Vous avez confirmé. En attente de ${esc(other(r))}.</span>`:`<button class="btn alt" data-conf="${r.id}">Échange effectué</button>`}
   <button class="btn alt" data-can="${r.id}">Annuler l'échange</button></div></div>`};
  const finRow=r=>{const st=r.status==="done"?`<span class="status ok">Échangé</span>${r.iRated?` <span class="status wait">Noté</span>`:Date.now()-r.doneAt<14*864e5?` <button class="btn alt" data-rate="${r.id}" style="margin-left:8px">Noter ${esc(other(r))}</button>`:""}${Date.now()-r.doneAt<7*864e5?` <button class="btn alt" data-chat="${r.id}" style="margin-left:8px">Chat</button>`:""}`:`<span class="status no">${r.status==="declined"?"Refusé":"Annulée"}</span>`;
   return `<div class="row"><p>${line(r)}</p>${st}</div>`};
  v.innerHTML=`<h2 style="margin-top:0">En attente de votre réponse</h2>`+
   (inc.length?inc.map(r=>`<div class="row"><p>${line(r)}</p><div class="acts"><button class="btn" data-acc="${r.id}">Accepter</button><button class="btn alt" data-dec="${r.id}" style="margin-top:auto">Refuser</button></div></div>`).join(""):`<p class="empty">Aucune demande pour le moment.</p>`)+
   (going.length?`<h2>Échanges en cours</h2><p class="sub">Discutez dans le chat, retrouvez-vous dans un lieu public, puis confirmez tous les deux. Les livres changent de propriétaire seulement après les deux confirmations.</p>`+going.map(goingRow).join(""):"")+
   `<h2>Envoyées par vous</h2>`+(sent.length?sent.map(r=>`<div class="row"><p>${line(r)}</p><span class="status wait">En attente de ${esc(r.to)}</span> <button class="btn alt" data-can="${r.id}" style="margin-left:8px">Annuler</button></div>`).join(""):`<p class="empty">Rien d'envoyé pour l'instant. Trouvez un livre dans Parcourir.</p>`)+
   (fin.length?`<h2>Terminées</h2>`+fin.map(finRow).join(""):"");
 }
}
function hint(){
 const w=get(target),o=get(+(document.querySelector("input[name=pick]:checked")||{}).value);
 const h=$("#hint");
 if(!o){h.textContent="Choisissez un livre pour comparer les valeurs.";return}
 const d=w.value-o.value;
 h.textContent=d>0?`« ${w.title} » vaut environ ${d} DH de plus que le vôtre. Ajouter ${d} DH rééquilibrerait l'échange.`:d<0?`Votre livre vaut environ ${-d} DH de plus. Le propriétaire peut ajouter de l'argent, ou vous pouvez échanger tel quel.`:"Les deux livres ont à peu près la même valeur. Un échange direct convient.";
}
function openSwap(id,pre){target=id;const m=mine();
 if(!m.length){toast("Ajoutez d'abord un livre à votre étagère");view="shelf";render();return}
 $("#dtitle").textContent=`Échanger contre « ${get(target).title} »`;
 const sel=m.some(b=>b.id===pre)?pre:m[0].id;
 $("#picks").innerHTML=m.map(b=>`<label class="pick"><input type="radio" name="pick" value="${b.id}" ${b.id===sel?"checked":""}>${esc(b.title)} <small>(${b.value} DH)</small></label>`).join("");
 $("#money").value=0;hint();$("#dlg").showModal()}
$("#tabs").onclick=e=>{const t=e.target.closest(".tab");if(t){view=t.dataset.v;try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}render()}};
$("#view").onclick=e=>{
 const q=a=>e.target.closest(`[data-${a}]`);
 if(q("want")){
  openSwap(+q("want").dataset.want);
 }
 if(q("prop")){const [a,b]=q("prop").dataset.prop.split("-");openSwap(+a,+b)}
 if(q("rm")){api("/api/wishes/"+q("rm").dataset.rm,"DELETE").then(boot)}
 if(q("go")){view=q("go").dataset.go;render()}
 if(q("gv")){const g=q("gv").dataset.gv;
  if(g==="login"||g==="signup"){gAuth=true;authMode=g;render()}
  else{gAuth=false;view=g;try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(err){}render();window.scrollTo(0,0)}}
 const acc=q("acc"),dec=q("dec");
 if(acc)act(acc.dataset.acc,"accept","Demande acceptée. Ouvrez le chat pour vous organiser.");
 if(dec)act(dec.dataset.dec,"decline","Demande refusée");
 if(q("can"))act(q("can").dataset.can,"cancel","Demande annulée");
 if(q("am"))renderAuth(q("am").dataset.am);
 if(q("chat"))openChat(+q("chat").dataset.chat);
 if(q("conf"))act(q("conf").dataset.conf,"confirm","Confirmation enregistrée. En attente de l'autre personne.");
 if(q("rate"))openRate(+q("rate").dataset.rate);
 if(q("del")){delAsk=+q("del").dataset.del;render()}
 if(q("delno")){delAsk=null;render()}
 if(q("open")){e.preventDefault();openBook(+q("open").dataset.open)}
 if(q("back")){view=prevView;try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(err){}render();window.scrollTo(0,0)}
 if(q("ph")){$("#bigph").src=photoSrc(bookId,+q("ph").dataset.ph)}
 if(q("share"))shareBook(+q("share").dataset.share);
 if(q("repbook")){const bb=get(+q("repbook").dataset.repbook);
  $("#bpextra").innerHTML=`<div class="add" style="grid-template-columns:1fr;margin:10px 0 0"><label>Que se passe-t-il avec cette annonce ?<input id="rr2" maxlength="300"></label><button class="btn" id="rok2" type="button">Envoyer le signalement</button></div>`;
  $("#rok2").onclick=async()=>{const why=$("#rr2").value.trim();if(why.length<3){toast("Décrivez le problème");return}
   const r=await api("/api/report","POST",{user:bb.owner,reason:"Annonce #"+bb.id+" : "+why});toast(r.error||"Signalement envoyé. Merci.");$("#bpextra").innerHTML=""}}
 if(q("delok")){api("/api/books/"+q("delok").dataset.delok,"DELETE").then(r=>{delAsk=null;toast(r.error||"Livre supprimé");if(view==="book"&&!r.error)view=prevView;return boot()})}
};
$("#picks").onchange=hint;
$("#cancel").onclick=()=>$("#dlg").close();
$("#send").onclick=async()=>{
 const o=document.querySelector("input[name=pick]:checked");if(!o)return;
 const r=await api("/api/requests","POST",{want:target,offer:+o.value,money:Math.max(0,+$("#money").value||0)});
 $("#dlg").close();if(r.error){toast(r.error);return}
 toast(`Demande envoyée à ${get(target).owner}`);view="reqs";await boot();
};
$("#mycity").innerHTML=CITY_NAMES.map(c=>`<option>${c}</option>`).join("");
$("#mycity").onchange=async e=>{await api("/api/me","PATCH",{city:e.target.value});await boot()};
$("#who").onclick=async e=>{if(e.target.closest("[data-out]")){await api("/api/logout","POST");me=null;await boot()}};
window.addEventListener("popstate",()=>{if(view==="book"&&!/^#\/livre\//.test(location.hash))view=prevView;render()});
boot();
setInterval(async()=>{if(!me||document.hidden||chatId)return;const r=await api("/api/unread");if(r.error)return;unreadTotal=r.unread;const n=r.pending+r.unread;$("#badge").hidden=!n;$("#badge").textContent=n},20000);
</script>
